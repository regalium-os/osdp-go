# buffers.lock — the ordinal ledger. Generated; commit it.
#
# Every field, enum value and method this plugin has assigned a target slot to is
# recorded here by its proto field number. A later build that would assign a
# different slot reports the disagreement instead of shipping it.
#
# That matters because the slot is a wire format. A consumer compiled against a
# schema where a field sat at ordinal 5 reads ordinal 5 forever, and if a rebuild
# moves something else there, nothing — not protoc, not capnp, not flatc, not the
# consumer — reports an error. It just reads the wrong field.
#
# Do not edit by hand, and do not resolve a merge conflict in this file textually.
# A conflict here means two branches each assigned a slot; deciding which one wins
# is a compatibility decision, so .gitattributes marks the file -merge to keep git
# from guessing.
version: 1
messages:
  - message: osdp.event.v1.CardRead
    fields:
      - number: 1
        ordinal: 0
        name: reader
      - number: 2
        ordinal: 1
        name: format
      - number: 3
        ordinal: 2
        name: bit_count
      - number: 4
        ordinal: 3
        name: data
  - message: osdp.event.v1.KeypadEntry
    fields:
      - number: 1
        ordinal: 0
        name: reader
      - number: 2
        ordinal: 1
        name: keys
  - message: osdp.event.v1.ManufacturerEvent
    fields:
      - number: 1
        ordinal: 0
        name: oui
      - number: 2
        ordinal: 1
        name: kind
      - number: 3
        ordinal: 2
        name: body
      - number: 4
        ordinal: 3
        name: recognized
  - message: osdp.event.v1.StatusChange
    fields:
      - number: 1
        ordinal: 0
        name: kind
      - number: 2
        ordinal: 1
        name: index
      - number: 3
        ordinal: 2
        name: active
enums:
  - enum: osdp.event.v1.StatusKind
    values:
      - number: 0
        ordinal: 0
        name: STATUS_KIND_UNSPECIFIED
      - number: 1
        ordinal: 1
        name: STATUS_KIND_INPUT
      - number: 2
        ordinal: 2
        name: STATUS_KIND_OUTPUT
      - number: 3
        ordinal: 3
        name: STATUS_KIND_TAMPER
      - number: 4
        ordinal: 4
        name: STATUS_KIND_POWER
      - number: 5
        ordinal: 5
        name: STATUS_KIND_LOCAL
