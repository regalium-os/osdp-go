name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# cgo is off by default for every job. The race detector is the one exception,
# and it overrides this at the job level rather than here; see that job.
env:
  CGO_ENABLED: "0"

jobs:
  go:
    name: Build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Every module, not just the root one. `go build ./...` covers the module
      # it runs in and no other, so building only at the root leaves the schema
      # and tooling modules unbuilt -- which is how generated code that did not
      # compile stayed green here for as long as it did.
      - name: Build and vet every module in the workspace
        run: |
          for dir in $(go work edit -json | jq -r '.Use[].DiskPath'); do
            echo "::group::$dir"
            (cd "$dir" && go build -o /dev/null ./... && go vet ./...) || exit 1
            echo "::endgroup::"
          done

      # The hexagon, the pure core, the 200-line limit, the banned imports and
      # the cgo ban. These read the source tree, so they run here rather than
      # being inferred from the build graph.
      - name: Architecture conformance
        run: go test ./internal/arch/ -v

      - name: Test every module in the workspace
        run: |
          for dir in $(go work edit -json | jq -r '.Use[].DiskPath'); do
            echo "::group::$dir"
            (cd "$dir" && go test -count=1 ./...) || exit 1
            echo "::endgroup::"
          done

  race:
    name: Race detector
    runs-on: ubuntu-latest

    # The single job that enables cgo, because on linux it has no choice: Go's
    # race detector builds without cgo only on darwin. On linux/amd64 and
    # linux/arm64 the toolchain refuses outright -- "-race requires cgo" -- and
    # on linux/arm the detector does not exist at all. Running this on a macOS
    # runner to keep CGO_ENABLED=0 would test races on a platform no panel uses.
    #
    # It does not weaken the cgo ban, which is about what ships rather than how
    # the tests are instrumented. Both gates still hold: internal/arch rejects
    # an `import "C"` in the source, and the purity job resolves the dependency
    # graph with cgo off, so a dependency that needs cgo fails there regardless
    # of what this job links into a test binary.
    env:
      CGO_ENABLED: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # A protocol library is driven concurrently by definition: one goroutine
      # reading a port while another writes it. A data race here corrupts a
      # frame rather than crashing, which is the kind of bug that gets blamed on
      # the wiring for a year.
      - name: Test under the race detector
        run: go test -race -count=1 ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # v9 or later is required: the action series through v6 cannot install
      # golangci-lint v2 at all, and refuses the version string rather than
      # falling back. .golangci.yml is v2 configuration.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          args: --timeout=5m

  purity:
    name: Pure Go, no cgo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # internal/arch already rejects an `import "C"`. This catches the other
      # route in: a dependency that pulls cgo transitively, which no amount of
      # source inspection would reveal.
      - name: No cgo in the dependency graph
        run: |
          if go list -deps ./... | grep -qx 'runtime/cgo'; then
            echo "::error::runtime/cgo is in the dependency graph; this library is pure Go"
            go list -deps ./... | grep -x 'runtime/cgo'
            exit 1
          fi
          echo "no cgo: $(go list -deps ./... | wc -l) packages in the graph"

      # The library must also cross-compile without a toolchain for the target,
      # which is the practical reason pure Go matters here: these panels are ARM.
      - name: Cross-compile to the platforms panels run on
        run: |
          for target in linux/arm linux/arm64 linux/amd64 windows/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build ./... \
              && echo "ok $target" \
              || { echo "::error::failed to build for $target"; exit 1; }
          done

  schema-drift:
    name: FlatBuffers mirror drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Runs on every CI run. A .fbs table that no longer matches the .proto it
      # mirrors is a field decoding at the wrong offset on a live bus.
      - name: Verify .fbs mirrors .proto
        run: go run ./tools/schemadrift

  bazel:
    name: Bazel build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', '.bazelversion') }}
          restore-keys: bazel-${{ runner.os }}-

      - name: Test
        run: bazel test --config=ci //...

      # Generated BUILD files must match the sources that produced them, or the
      # Bazel graph and the Go graph quietly describe different programs.
      - name: BUILD files are up to date
        run: |
          bazel run --config=ci //:gazelle
          git diff --exit-code || {
            echo "::error::BUILD files are stale. Run 'just tidy' and commit the result."
            exit 1
          }
